# Gera o CV em PDF (PT, EN, ES) a partir do conteúdo do site sempre que ele mudar,
# salva os arquivos em arquivos/ e pede ao GitHub Pages que publique de novo.
name: CV em PDF

on:
  push:
    branches: [main]
    paths:
      - cv.html
      - pesquisa.html
      - midia.html
      - scripts/build_cv.py
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: cv-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install beautifulsoup4

      - name: Gerar os PDFs
        run: python scripts/build_cv.py
        env:
          CHROME: google-chrome
          TZ: America/Sao_Paulo

      - name: Salvar no repositório e republicar o site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arquivos/*.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza CV em PDF"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
